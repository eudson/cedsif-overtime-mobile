name: cedsif_overtime_mobile
description: Horas Extras mobile application for CEDSIF.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  go_router: ^17.0.1
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1
  connectivity_plus: ^6.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  fpdart: ^1.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.3
  easy_localization: ^3.0.7
  logger: ^2.0.2+1
  workmanager: ^0.9.0+3
  equatable: ^2.1.0
  intl: ^0.20.2
  uuid: ^4.6.0
  crypto: ^3.0.7
  path_provider: ^2.1.6
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0
  flutter_svg: ^2.3.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  flutter_spinkit: ^5.2.2
  url_launcher: ^6.3.2
  cupertino_icons: ^1.0.9
  camera: 0.11.2+1
  geolocator: 14.0.3
  permission_handler: 12.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.2
  build_runner: ^2.5.4
  riverpod_generator: ^4.0.0
  freezed: ^3.2.3
  json_serializable: ^6.9.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/images/
    - assets/launcher_icon.png
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/launcher_icon.png
  remove_alpha_ios: true
